# ==============================================================================
# SuamiSihat™ Design System — Production Nginx Configuration
# Supports clean URL masking, security headers, and high-performance asset caching.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name assets.suamisihat.com.my design.suamisihat.com assets.suamisihat.myds.me localhost;

    root /volume1/web/ss_assets; # Adjust to deployment path (e.g. /usr/share/nginx/html)
    index index.html;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.iconify.design; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com" always;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2;

    # --------------------------------------------------------------------------
    # URL Routing & SvelteKit Static Hosting
    # --------------------------------------------------------------------------

    # 1. Main SPA/SSG fallback location
    location / {
        try_files $uri $uri/ $uri/index.html /index.html /404.html =404;
    }

    # 2. Clean Short Aliases
    location = /brand       { return 301 /brand-system/; }
    location = /guidelines  { return 301 /brand-guidelines/; }
    location = /roadmap     { return 301 /doc/?doc=roadmap; }
    location = /changelog   { return 301 /doc/?doc=changelog; }

    # 3. Clean Doc URL Query Shortcuts
    location ~ ^/doc-([a-zA-Z0-9_-]+)/?$ {
        return 301 /doc/?doc=$1;
    }

    # --------------------------------------------------------------------------
    # Static Assets & Long-Term Caching
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;
}

name: Auto Deploy to Synology NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Synology Web Station
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Synology NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "suamisihat.myds.me"
          port: 2222
          username: "harussani"
          password: ${{ secrets.NAS_PASSWORD }}
          script: |
            cd /volume1/web/ss_assets
            git fetch origin main
            git reset --hard origin/main
            echo "Successfully updated https://assets.suamisihat.myds.me/"

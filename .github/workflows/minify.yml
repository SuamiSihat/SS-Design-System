name: Build — Minify CSS & JS

on:
  push:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'scripts/**'
      - 'package.json'

  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write

jobs:
  minify:
    name: Minify assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run minification
        run: npm run build

      - name: Commit minified files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/dist/ assets/js/dist/
          if git diff --cached --quiet; then
            echo "No changes to commit — minified files are up to date."
          else
            git commit -m "build(PERF-01): update minified CSS/JS [skip ci]"
            git push
          fi

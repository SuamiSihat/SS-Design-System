<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SuamiSihat™ Design System — The central single source of truth for brand guidelines, design tokens, multi-platform UI components and healthcare assets.">
    <meta name="keywords" content="SuamiSihat™, SS Health, brand guidelines, design system, logo, typography, Fluent 2, SS CAM, mail signature, tokens">
    <meta name="author" content="SuamiSihat™">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SuamiSihat™ Design System">
    <meta property="og:description" content="Authoritative Visual Language & Multi-Platform Component Standard for SuamiSihat™">
    <meta property="og:image" content="/public/brand/logos/ss-logomark-light.svg">

    <!-- Favicons -->
    <link rel="icon" href="/public/brand/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/public/brand/logos/ss-logomark-light.svg" type="image/svg+xml">
    <link rel="icon" href="/public/brand/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/public/brand/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/public/brand/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/public/brand/favicon/site.webmanifest">
    <meta name="theme-color" content="#022057">

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Layout Utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Design Tokens & Fluent Stylesheets -->
    <link rel="stylesheet" href="/assets/css/fluent.css">
    <link rel="stylesheet" href="/assets/css/ss_theme.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/markdown.css">

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>

    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
</body>
</html>

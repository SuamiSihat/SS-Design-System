<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6DC6EC;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grad)" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <circle cx="950" cy="150" r="170" fill="rgba(109, 198, 236, 0.2)" filter="blur(35px)" />
  <circle cx="200" cy="250" r="90" fill="rgba(255, 255, 255, 0.08)" filter="blur(15px)" />
  <text x="80" y="160" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="48px" letter-spacing="2">REJAL</text>
  <text x="80" y="200" fill="rgba(255, 255, 255, 0.7)" font-family="'Poppins', sans-serif" font-size="18px">CLINICAL AESTHETICS &amp; REJUVENATION</text>
</svg>

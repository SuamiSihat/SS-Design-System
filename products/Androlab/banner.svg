<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022057;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#043388;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grad)" />
  <rect width="1200" height="300" fill="url(#grid)" />
  <circle cx="950" cy="150" r="180" fill="rgba(33, 161, 247, 0.15)" filter="blur(40px)" />
  <circle cx="200" cy="250" r="100" fill="rgba(109, 198, 236, 0.1)" filter="blur(20px)" />
  <text x="80" y="160" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="48px" letter-spacing="2">ANDROLAB</text>
  <text x="80" y="200" fill="rgba(255, 255, 255, 0.7)" font-family="'Poppins', sans-serif" font-size="18px">CLINICAL SUPPORT SYSTEM</text>
</svg>

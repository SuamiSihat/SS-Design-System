<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BD9A73;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CCAC8D;stop-opacity:1" />
    </linearGradient>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grad)" />
  <rect width="1200" height="300" fill="url(#lines)" />
  <circle cx="950" cy="150" r="160" fill="rgba(255, 255, 255, 0.15)" filter="blur(35px)" />
  <circle cx="250" cy="200" r="90" fill="rgba(2, 32, 87, 0.1)" filter="blur(15px)" />
  <text x="80" y="160" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="bold" font-size="48px" letter-spacing="2">MENSCULINE</text>
  <text x="80" y="200" fill="rgba(255, 255, 255, 0.7)" font-family="'Poppins', sans-serif" font-size="18px">PREMIUM GROOMING &amp; PERSONAL CARE</text>
</svg>

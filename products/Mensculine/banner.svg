<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1C;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0B2545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#038AFA;stop-opacity:1" />
    </linearGradient>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#grad)" />
  <rect width="1200" height="300" fill="url(#lines)" />
  <circle cx="950" cy="150" r="160" fill="rgba(3, 138, 250, 0.25)" filter="blur(35px)" />
  <circle cx="250" cy="200" r="90" fill="rgba(241, 241, 241, 0.1)" filter="blur(15px)" />
  <text x="80" y="160" fill="#F1F1F1" font-family="'Segoe UI Variable', 'Inter', 'Poppins', sans-serif" font-weight="bold" font-size="48px" letter-spacing="2">MENSCULINE</text>
  <text x="80" y="200" fill="#038AFA" font-family="'Segoe UI Variable', 'Inter', 'Poppins', sans-serif" font-size="18px" font-weight="600">INTERNATIONAL PREMIUM CARE &amp; BOTANICAL FORMULATION</text>
</svg>

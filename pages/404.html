<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - SS Brand Assets</title>
    <link rel="icon" href="../public/brand/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #022461;
            --primary-light: #043388;
            --accent: #21a1f7;
            --accent-light: #6dc6ec;
            --warning: #f7e143;
            --text-light: #ffffff;
            --text-dark: #1c1c1c;
            --background: #ffffff;
            --gradient-blue: linear-gradient(135deg, #022461 0%, #21a1f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--gradient-blue);
            width: 100vw;
            height: 100vh;
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            width: 60px;
            height: 60px;
            left: 20%;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            width: 100px;
            height: 100px;
            left: 70%;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            width: 40px;
            height: 40px;
            left: 80%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        .error-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2em;
            max-width: 800px;
            padding: 2em;
        }

        .logo-container {
            margin-bottom: 1em;
        }

        .logo-container img {
            height: 200px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .error-num {
            font-size: 12em;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            color: var(--accent-light);
            text-shadow: 0 10px 30px rgba(109, 198, 236, 0.5);
            animation: numberGlow 2s ease-in-out infinite alternate;
        }

        @keyframes numberGlow {
            0% {
                text-shadow: 0 10px 30px rgba(109, 198, 236, 0.5);
            }
            100% {
                text-shadow: 0 10px 40px rgba(109, 198, 236, 0.8);
            }
        }

        .error-message {
            font-size: 1.5em;
            font-weight: 400;
            margin-bottom: 2em;
            max-width: 600px;
            line-height: 1.6;
        }

        .error-description {
            font-size: 1.1em;
            margin-bottom: 3em;
            opacity: 0.9;
            max-width: 500px;
        }

        .error-actions {
            display: flex;
            gap: 1.5em;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            color: var(--text-light);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            padding: 15px 30px;
            border: 2px solid var(--text-light);
            border-radius: var(--f-radius-md);
            transition: all 0.3s ease;
            background: transparent;
            cursor: pointer;
            font-size: 0.9em;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--text-light);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--primary);
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            color: var(--text-light);
        }

        .search-container {
            margin-top: 2em;
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: var(--f-radius-md);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1em;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-light);
        }

        @media (max-width: 768px) {
            .error-num {
                font-size: 8em;
            }
            
            .logo-container img {
                height: 150px;
            }
            
            .error-message {
                font-size: 1.2em;
            }
            
            .error-description {
                font-size: 1em;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }

        @media (max-width: 480px) {
            .error-num {
                font-size: 6em;
            }
            
            .logo-container img {
                height: 120px;
            }
            
            .particle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="error-container">
        <div class="logo-container">
            <img src="../public/brand/logos/ss-logomark-light.svg" alt="SuamiSihat™ Logo">
        </div>
        
        <h1 class="error-num">404</h1>
        
        <p class="error-message">
            Oops! This page seems to have wandered off into the digital wilderness.
        </p>
        
        <p class="error-description">
            The page you're looking for doesn't exist or has been moved to a new location.
        </p>
        
        <div class="error-actions">
            <a href="../index.html" class="btn btn-primary">Go Home</a>
            <a href="brand-guidelines.html" class="btn">Brand Guidelines</a>
            <a href="mailto:branding@suamisihat.com" class="btn">Contact Support</a>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for something else..." 
                   onkeypress="if(event.key==='Enter') searchPage(this.value)">
        </div>
    </div>

    <script>
        // Search functionality
        function searchPage(query) {
            if (query.trim()) {
                // You can implement actual search functionality here
                // For now, redirect to home page
                window.location.href = '../index.html';
            }
        }

        // Add some interactive effects
        document.addEventListener('DOMContentLoaded', function() {
            // Add click effect to buttons
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // Create ripple effect
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });

            // Add parallax effect to particles
            document.addEventListener('mousemove', function(e) {
                const particles = document.querySelectorAll('.particle');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                particles.forEach((particle, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed;
                    const y = (mouseY - 0.5) * speed;
                    
                    particle.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        });

        // Add CSS for ripple effect
        const style = document.createElement('style');
        style.textContent = `
            .btn {
                position: relative;
                overflow: hidden;
            }
            
            .ripple {
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.3);
                transform: scale(0);
                animation: ripple-animation 0.6s linear;
                pointer-events: none;
            }
            
            @keyframes ripple-animation {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

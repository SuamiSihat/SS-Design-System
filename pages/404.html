<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>404 - Page Not Found · SuamiSihat™ Design System</title>
    <link rel="icon" id="pageFavicon" href="../public/brand/logos/ss-logomark-light.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
        :root {
            --ss-prussian: #022057;
            --ss-blue: #043388;
            --ss-azure: #21A1F7;
            --ss-malibu: #6DC6EC;
            --ss-dark: #090D16;
            --ss-text-primary: #FFFFFF;
            --ss-text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--ss-dark);
            width: 100vw;
            min-height: 100vh;
            color: var(--ss-text-primary);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Fullscreen Animated Canvas ── */
        #heroCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        /* ── Radial Ambient Glow Overlay ── */
        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(33, 161, 247, 0.12) 0%, rgba(2, 32, 87, 0.4) 60%, rgba(9, 13, 22, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ── Content Card ── */
        .error-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            width: 90%;
            padding: 2.5rem 2rem;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(33, 161, 247, 0.1);
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-container {
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-height: 48px;
            width: auto;
            max-width: 240px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.03);
        }

        .error-num {
            font-size: clamp(5rem, 14vw, 8.5rem);
            font-weight: 800;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--ss-malibu) 50%, var(--ss-azure) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 40px rgba(33, 161, 247, 0.4);
            animation: numberPulse 3s ease-in-out infinite alternate;
        }

        @keyframes numberPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(33, 161, 247, 0.25)); }
            100% { transform: scale(1.02); filter: drop-shadow(0 0 35px rgba(109, 198, 236, 0.5)); }
        }

        .error-message {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            font-weight: 600;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            color: #FFFFFF;
            line-height: 1.4;
        }

        .error-description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ss-text-muted);
            max-width: 520px;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 0.875rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        /* ── Action Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.84rem;
            letter-spacing: 0.02em;
            padding: 0.75rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            color: #FFFFFF;
            text-decoration: none;
        }

        /* Primary 10% Azure CTA */
        .btn-primary {
            background: var(--ss-azure);
            border-color: var(--ss-azure);
            color: var(--ss-prussian) !important;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(33, 161, 247, 0.35);
        }

        .btn-primary:hover {
            background: var(--ss-malibu);
            border-color: var(--ss-malibu);
            color: var(--ss-prussian) !important;
            box-shadow: 0 6px 24px rgba(33, 161, 247, 0.5);
            transform: translateY(-2px);
        }

        /* ── Search Input ── */
        .search-container {
            position: relative;
            max-width: 440px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(2, 32, 87, 0.4);
            color: #FFFFFF;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-input:focus {
            border-color: var(--ss-azure);
            background: rgba(4, 51, 136, 0.5);
            box-shadow: 0 0 0 3px rgba(33, 161, 247, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            pointer-events: none;
        }

        @media (max-width: 576px) {
            .error-container {
                padding: 2rem 1.25rem;
            }
            .error-actions {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 60:30:10 Animated Background Canvas -->
    <canvas id="heroCanvas"></canvas>
    <div class="ambient-glow"></div>

    <main id="main-content" class="error-container" role="main">
        <!-- Resilient Logo Container -->
        <div class="logo-container">
            <a id="homeLink" href="../index.html" aria-label="SuamiSihat™ Home">
                <img id="errorLogo" 
                     src="../public/brand/logos/00_logo_suamisihat/logo_suamisihat_primary_dark.svg" 
                     alt="SuamiSihat™ Design System">
            </a>
        </div>
        
        <div class="error-num" aria-hidden="true">404</div>
        
        <h1 class="error-message">
            Oops! This page seems to have wandered off.
        </h1>
        
        <p class="error-description">
            The link you followed may be broken, or the page has been moved or renamed in the SuamiSihat™ ecosystem.
        </p>
        
        <div class="error-actions">
            <a id="btnHome" href="../index.html" class="btn btn-primary">
                <iconify-icon icon="fluent:home-24-filled"></iconify-icon>
                <span>Go Home</span>
            </a>
            <a id="btnGuidelines" href="brand-guidelines.html" class="btn">
                <iconify-icon icon="fluent:book-open-24-regular"></iconify-icon>
                <span>Brand Guidelines</span>
            </a>
            <a id="btnComponents" href="components.html" class="btn">
                <iconify-icon icon="fluent:apps-24-regular"></iconify-icon>
                <span>Components</span>
            </a>
            <a href="mailto:branding@suamisihat.com" class="btn">
                <iconify-icon icon="fluent:mail-24-regular"></iconify-icon>
                <span>Contact Support</span>
            </a>
        </div>

        <div class="search-container">
            <iconify-icon icon="fluent:search-24-regular" class="search-icon"></iconify-icon>
            <input type="text" class="search-input" placeholder="Search documentation or assets..." 
                   onkeypress="if(event.key==='Enter') searchPage(this.value)">
        </div>
    </main>

    <script>
        // ─────────────────────────────────────────────────────────────
        // 1. Resilient Dynamic Path Resolver (Works at root & subfolder)
        // ─────────────────────────────────────────────────────────────
        (function() {
            var pathname = window.location.pathname;
            var isAtRoot = !pathname.includes('/pages/') && !pathname.includes('\\pages\\');
            var prefix = isAtRoot ? '' : '../';
            var pagesPrefix = isAtRoot ? 'pages/' : '';

            // Resolve logo
            var logo = document.getElementById('errorLogo');
            if (logo) {
                var logoSrc = prefix + 'public/brand/logos/00_logo_suamisihat/logo_suamisihat_primary_dark.svg';
                logo.src = logoSrc;
                logo.onerror = function() {
                    if (!this.getAttribute('data-fallback')) {
                        this.setAttribute('data-fallback', '1');
                        this.src = (isAtRoot ? 'public/' : '../public/') + 'brand/logos/ss-logomark-light.svg';
                    }
                };
            }

            // Resolve favicon
            var fav = document.getElementById('pageFavicon');
            if (fav) {
                fav.href = prefix + 'public/brand/logos/ss-logomark-light.svg';
            }

            // Resolve navigation links
            var homeLink = document.getElementById('homeLink');
            var btnHome = document.getElementById('btnHome');
            var btnGuidelines = document.getElementById('btnGuidelines');
            var btnComponents = document.getElementById('btnComponents');

            if (homeLink) homeLink.href = prefix + 'index.html';
            if (btnHome) btnHome.href = prefix + 'index.html';
            if (btnGuidelines) btnGuidelines.href = pagesPrefix + 'brand-guidelines.html';
            if (btnComponents) btnComponents.href = pagesPrefix + 'components.html';
        })();

        // ─────────────────────────────────────────────────────────────
        // 2. Search Page Handler
        // ─────────────────────────────────────────────────────────────
        function searchPage(query) {
            if (query && query.trim()) {
                var isAtRoot = !window.location.pathname.includes('/pages/');
                var target = (isAtRoot ? 'pages/' : '') + 'brand-system.html?q=' + encodeURIComponent(query.trim());
                window.location.href = target;
            }
        }

        // ─────────────────────────────────────────────────────────────
        // 3. SuamiSihat™ 60:30:10 Animated Loop Background Engine
        // ─────────────────────────────────────────────────────────────
        (function() {
            var canvas = document.getElementById('heroCanvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var width, height;
            var step = 0;
            var mouseX = 0, mouseY = 0;
            var targetMouseX = 0, targetMouseY = 0;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resize);
            resize();

            // Interactive mouse tracking with gentle dampening
            window.addEventListener('mousemove', function(e) {
                targetMouseX = (e.clientX / width - 0.5) * 40;
                targetMouseY = (e.clientY / height - 0.5) * 40;
            });

            // 10% Radiant Energy Particles
            var particleCount = Math.min(32, Math.floor(width / 40));
            var particles = [];
            for (var i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.2 + 1.2,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.5 + 0.25,
                    isAzure: Math.random() > 0.4
                });
            }

            function render() {
                step += 0.005;
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                ctx.clearRect(0, 0, width, height);

                // 60% Foundation Base: Deep Prussian Blue to Void Dark
                var baseGrad = ctx.createLinearGradient(0, 0, width + mouseX, height + mouseY);
                baseGrad.addColorStop(0, '#022057');   // SS Prussian Blue
                baseGrad.addColorStop(0.5, '#043388'); // SS Blue
                baseGrad.addColorStop(1, '#090D16');   // Void Dark
                ctx.fillStyle = baseGrad;
                ctx.fillRect(0, 0, width, height);

                // 30% Structural Fluid Sine Waves
                ctx.save();
                for (var w = 0; w < 3; w++) {
                    ctx.beginPath();
                    var yOffset = height * 0.62 + (w * 45) + (mouseY * (w + 1) * 0.2);
                    ctx.moveTo(0, height);
                    ctx.lineTo(0, yOffset);

                    for (var x = 0; x <= width; x += 25) {
                        var wave = Math.sin(x * 0.0025 + step + (w * 1.5)) * 32 +
                                   Math.cos(x * 0.0012 - step * 0.8) * 18;
                        ctx.lineTo(x, yOffset + wave);
                    }

                    ctx.lineTo(width, height);
                    ctx.closePath();

                    if (w === 0) {
                        ctx.fillStyle = 'rgba(2, 32, 87, 0.45)';
                    } else if (w === 1) {
                        ctx.fillStyle = 'rgba(4, 51, 136, 0.25)';
                    } else {
                        ctx.fillStyle = 'rgba(9, 13, 22, 0.75)';
                    }
                    ctx.fill();
                }
                ctx.restore();

                // 10% Luminous Azure & Malibu Energy Nodes
                for (var p = 0; p < particles.length; p++) {
                    var pt = particles[p];
                    pt.x += pt.vx;
                    pt.y += pt.vy;

                    if (pt.x < 0) pt.x = width;
                    if (pt.x > width) pt.x = 0;
                    if (pt.y < 0) pt.y = height;
                    if (pt.y > height) pt.y = 0;

                    ctx.beginPath();
                    ctx.arc(pt.x + (mouseX * 0.3), pt.y + (mouseY * 0.3), pt.radius, 0, Math.PI * 2);
                    
                    if (pt.isAzure) {
                        ctx.fillStyle = 'rgba(33, 161, 247, ' + pt.alpha + ')';
                        ctx.shadowColor = '#21A1F7';
                    } else {
                        ctx.fillStyle = 'rgba(109, 198, 236, ' + (pt.alpha * 0.8) + ')';
                        ctx.shadowColor = '#6DC6EC';
                    }
                    ctx.shadowBlur = 14;
                    ctx.fill();
                }

                requestAnimationFrame(render);
            }

            render();
        })();
    </script>
</body>
</html>

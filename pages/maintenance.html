<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - SS Brand Assets</title>
    <link rel="icon" href="../public/brand/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #022461;
            --primary-light: #043388;
            --accent: #21a1f7;
            --accent-light: #6dc6ec;
            --warning: #f7e143;
            --danger: #ff6b6b;
            --text-light: #ffffff;
            --text-dark: #1c1c1c;
            --background: #000033;
            --gradient-dark: linear-gradient(135deg, #000033 0%, #022461 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--gradient-dark);
            width: 100vw;
            height: 100vh;
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #000033, #000066);
            z-index: 1;
        }

        /* Overlay UI Elements */
        .ui-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .ui-overlay * {
            pointer-events: auto;
        }

        /* Top Left - Maintenance Text */
        .maintenance-info {
            top: 20px;
            left: 20px;
            background: rgba(2, 36, 97, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--accent);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .maintenance-title {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--accent-light);
            margin-bottom: 5px;
        }

        .maintenance-subtitle {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* Top Right - Completion Time */
        .completion-time {
            top: 20px;
            right: 20px;
            background: rgba(2, 36, 97, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--warning);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .time-label {
            font-size: 0.8em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .time-value {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--warning);
        }

        /* Center Logo */
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            opacity: 0.1;
            pointer-events: none;
        }

        .center-logo img {
            height: 300px;
            filter: drop-shadow(0 10px 20px rgba(109, 198, 236, 0.3));
        }

        /* Bottom Left - Game Stats */
        .game-stats {
            bottom: 20px;
            left: 20px;
            background: rgba(2, 36, 97, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--accent-light);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .stat-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .stat-item:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-right: 10px;
            min-width: 60px;
        }

        .stat-value {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--accent-light);
        }

        .lives-display {
            display: flex;
            gap: 5px;
        }

        .life-heart {
            width: 20px;
            height: 20px;
            background: var(--danger);
            border-radius: 50%;
            position: relative;
        }

        .life-heart::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: var(--danger);
            border-radius: 50%;
        }

        /* Bottom Right - Game Controls */
        .game-controls {
            bottom: 20px;
            right: 20px;
            background: rgba(2, 36, 97, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid var(--warning);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: var(--accent);
            color: var(--text-light);
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .control-btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.reset {
            background: var(--danger);
        }

        .control-btn.reset:hover {
            background: #ff8585;
        }

        /* Game Instructions */
        .game-instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--accent);
            text-align: center;
            max-width: 400px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .game-instructions h2 {
            color: var(--accent-light);
            margin-bottom: 15px;
        }

        .game-instructions p {
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .game-instructions .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .key {
            background: var(--primary);
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid var(--accent);
            font-family: monospace;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .maintenance-info,
            .completion-time,
            .game-stats,
            .game-controls {
                padding: 10px 15px;
                font-size: 0.8em;
            }

            .maintenance-title {
                font-size: 1.2em;
            }

            .center-logo img {
                height: 200px;
            }

            .control-btn {
                padding: 10px 16px;
                font-size: 0.8em;
            }
        }

        @media (max-width: 480px) {
            .maintenance-info,
            .completion-time,
            .game-stats,
            .game-controls {
                padding: 8px 12px;
                font-size: 0.7em;
            }

            .center-logo img {
                height: 150px;
            }

            .game-instructions {
                padding: 20px;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>

    <!-- Center Logo -->
    <div class="center-logo">
        <img src="../public/brand/logos/ss-logomark-light.svg" alt="SuamiSihat™ Logo">
    </div>

    <!-- Top Left - Maintenance Info -->
    <div class="ui-overlay maintenance-info">
        <div class="maintenance-title">SuamiSihat™ DS | <small>Under Maintenance</small></div>
    </div>

    <!-- Top Right - Completion Time -->
    <div class="ui-overlay completion-time">
        <div class="time-label">Expected Completion</div>
        <div class="time-value">2 hours</div>
    </div>

    <!-- Bottom Left - Game Stats -->
    <div class="ui-overlay game-stats">
        <div class="stat-item">
            <span class="stat-label">Score:</span>
            <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Lives:</span>
            <div class="lives-display" id="lives">
                <div class="life-heart"></div>
                <div class="life-heart"></div>
                <div class="life-heart"></div>
            </div>
        </div>
        <div class="stat-item">
            <span class="stat-label">Level:</span>
            <span class="stat-value" id="level">1</span>
        </div>
    </div>

    <!-- Bottom Right - Game Controls -->
    <div class="ui-overlay game-controls">
        <button class="control-btn" onclick="startGame()">Start Game</button>
        <button class="control-btn reset" onclick="resetGame()">Reset</button>
    </div>

    <!-- Game Instructions -->
    <div class="game-instructions" id="instructions">
        <h2>🚀 SuamiSihat™ Defender</h2>
        <p>Defend men's health against harmful influences!</p>
        <p>Use arrow keys to move and spacebar to shoot.</p>
        <div class="controls">
            <span class="key">←</span>
            <span class="key">→</span>
            <span class="key">SPACE</span>
        </div>
        <button class="control-btn btn-margin-top" onclick="hideInstructions()">Start Shooting</button>
    </div>

    <script src="../assets/js/invader.js"></script>
</body>
</html>

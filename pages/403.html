<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>403 - Access Forbidden · SuamiSihat™ Design System</title>
    <link rel="icon" id="pageFavicon" href="../public/brand/logos/ss-logomark-light.svg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
        :root {
            --ss-prussian: #022057;
            --ss-blue: #043388;
            --ss-azure: #21A1F7;
            --ss-malibu: #6DC6EC;
            --ss-dark: #090D16;
            --ss-text-primary: #FFFFFF;
            --ss-text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--ss-dark);
            width: 100vw;
            min-height: 100vh;
            color: var(--ss-text-primary);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #heroCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(33, 161, 247, 0.12) 0%, rgba(2, 32, 87, 0.4) 60%, rgba(9, 13, 22, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .error-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 640px;
            width: 90%;
            padding: 2.5rem 2rem;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(33, 161, 247, 0.1);
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-container {
            margin-bottom: 1.25rem;
        }

        .logo-container img {
            max-height: 48px;
            width: auto;
            max-width: 240px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .error-num {
            font-size: clamp(5rem, 14vw, 8rem);
            font-weight: 800;
            margin: 0;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--ss-malibu) 50%, var(--ss-azure) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-message {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            font-weight: 600;
            margin-top: 0.5rem;
            margin-bottom: 0.75rem;
            color: #FFFFFF;
        }

        .error-description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--ss-text-muted);
            max-width: 500px;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 0.875rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.84rem;
            padding: 0.75rem 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            color: #FFFFFF;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--ss-azure);
            border-color: var(--ss-azure);
            color: var(--ss-prussian) !important;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(33, 161, 247, 0.35);
        }

        .btn-primary:hover {
            background: var(--ss-malibu);
            border-color: var(--ss-malibu);
            color: var(--ss-prussian) !important;
        }
    </style>
</head>
<body>
    <canvas id="heroCanvas"></canvas>
    <div class="ambient-glow"></div>

    <main id="main-content" class="error-container" role="main">
        <div class="logo-container">
            <a id="homeLink" href="../index.html" aria-label="SuamiSihat™ Home">
                <img id="errorLogo" 
                     src="../public/brand/logos/00_logo_suamisihat/logo_suamisihat_primary_dark.svg" 
                     alt="SuamiSihat™ Design System">
            </a>
        </div>
        
        <div class="error-num" aria-hidden="true">403</div>
        
        <h1 class="error-message">Access Restricted</h1>
        
        <p class="error-description">
            You don't have permission to access this internal asset or resource in the SuamiSihat™ ecosystem.
        </p>
        
        <div class="error-actions">
            <a id="btnHome" href="../index.html" class="btn btn-primary">
                <iconify-icon icon="fluent:home-24-filled"></iconify-icon>
                <span>Return to Hub</span>
            </a>
            <a href="mailto:branding@suamisihat.com" class="btn">
                <iconify-icon icon="fluent:key-24-regular"></iconify-icon>
                <span>Request Access</span>
            </a>
        </div>
    </main>

    <script>
        (function() {
            var pathname = window.location.pathname;
            var isAtRoot = !pathname.includes('/pages/') && !pathname.includes('\\pages\\');
            var prefix = isAtRoot ? '' : '../';

            var logo = document.getElementById('errorLogo');
            if (logo) {
                logo.src = prefix + 'public/brand/logos/00_logo_suamisihat/logo_suamisihat_primary_dark.svg';
                logo.onerror = function() {
                    if (!this.getAttribute('data-fallback')) {
                        this.setAttribute('data-fallback', '1');
                        this.src = (isAtRoot ? 'public/' : '../public/') + 'brand/logos/ss-logomark-light.svg';
                    }
                };
            }

            var fav = document.getElementById('pageFavicon');
            if (fav) fav.href = prefix + 'public/brand/logos/ss-logomark-light.svg';

            var homeLink = document.getElementById('homeLink');
            var btnHome = document.getElementById('btnHome');
            if (homeLink) homeLink.href = prefix + 'index.html';
            if (btnHome) btnHome.href = prefix + 'index.html';
        })();

        // Canvas loop
        (function() {
            var canvas = document.getElementById('heroCanvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var width, height, step = 0;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
            }
            window.addEventListener('resize', resize);
            resize();

            var particles = Array.from({ length: 24 }, function() {
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 1,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    alpha: Math.random() * 0.5 + 0.2
                };
            });

            function render() {
                step += 0.005;
                ctx.clearRect(0, 0, width, height);

                var baseGrad = ctx.createLinearGradient(0, 0, width, height);
                baseGrad.addColorStop(0, '#022057');
                baseGrad.addColorStop(0.5, '#043388');
                baseGrad.addColorStop(1, '#090D16');
                ctx.fillStyle = baseGrad;
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                for (var w = 0; w < 3; w++) {
                    ctx.beginPath();
                    var yOffset = height * 0.65 + (w * 40);
                    ctx.moveTo(0, height);
                    ctx.lineTo(0, yOffset);
                    for (var x = 0; x <= width; x += 25) {
                        var wave = Math.sin(x * 0.0025 + step + (w * 1.5)) * 30 +
                                   Math.cos(x * 0.0012 - step * 0.8) * 16;
                        ctx.lineTo(x, yOffset + wave);
                    }
                    ctx.lineTo(width, height);
                    ctx.closePath();
                    ctx.fillStyle = w === 0 ? 'rgba(2, 32, 87, 0.45)' : w === 1 ? 'rgba(4, 51, 136, 0.25)' : 'rgba(9, 13, 22, 0.75)';
                    ctx.fill();
                }
                ctx.restore();

                for (var p = 0; p < particles.length; p++) {
                    var pt = particles[p];
                    pt.x += pt.vx; pt.y += pt.vy;
                    if (pt.x < 0) pt.x = width; if (pt.x > width) pt.x = 0;
                    if (pt.y < 0) pt.y = height; if (pt.y > height) pt.y = 0;

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(33, 161, 247, ' + pt.alpha + ')';
                    ctx.shadowColor = '#21A1F7';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                }
                requestAnimationFrame(render);
            }
            render();
        })();
    </script>
</body>
</html>

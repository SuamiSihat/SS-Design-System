<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Forbidden - SS Brand Assets</title>
    <link rel="icon" href="../public/brand/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #022461;
            --primary-light: #043388;
            --accent: #21a1f7;
            --accent-light: #6dc6ec;
            --warning: #f7e143;
            --text-light: #ffffff;
            --text-dark: #1c1c1c;
            --background: #ffffff;
            --gradient-blue: linear-gradient(135deg, #022461 0%, #21a1f7 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--gradient-blue);
            width: 100vw;
            height: 100vh;
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 60px; height: 60px; left: 25%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 100px; height: 100px; left: 75%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 40px; height: 40px; left: 85%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        .error-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5em;
            max-width: 800px;
            padding: 2em;
        }

        .logo-container img {
            height: 120px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .error-num {
            font-size: 10em;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            color: var(--accent-light);
            text-shadow: 0 10px 30px rgba(109, 198, 236, 0.5);
        }

        /* Padlock Graphic CSS */
        .lock-wrapper {
            position: relative;
            width: 100px;
            height: 120px;
            margin: 1rem 0;
            cursor: pointer;
        }

        .lock-shackle {
            position: absolute;
            top: 0;
            left: 20px;
            width: 60px;
            height: 60px;
            border: 10px solid #ffffff;
            border-bottom: none;
            border-radius: 30px 30px 0 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 10px 50px;
        }

        .lock-body {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 80px;
            height: 70px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease;
        }

        .lock-keyhole {
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            position: relative;
        }

        .lock-keyhole::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 5px;
            width: 6px;
            height: 16px;
            background: var(--primary);
        }

        /* Interactive Locked States on Hover */
        .lock-wrapper:hover .lock-shackle {
            transform: translateY(-10px) rotate(-15deg);
        }
        
        .lock-wrapper:hover .lock-body {
            background: var(--accent-light);
        }

        .error-message {
            font-size: 1.5em;
            font-weight: 400;
            max-width: 600px;
            line-height: 1.6;
        }

        .error-description {
            font-size: 1.1em;
            opacity: 0.9;
            max-width: 500px;
            margin-bottom: 2em;
        }

        .error-actions {
            display: flex;
            gap: 1.5em;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            color: var(--text-light);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            padding: 14px 28px;
            border: 2px solid var(--text-light);
            border-radius: var(--f-radius-md);
            transition: all 0.3s ease;
            background: transparent;
            cursor: pointer;
            font-size: 0.9em;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--text-light);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: var(--primary);
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .error-num { font-size: 6em; }
            .logo-container img { height: 90px; }
            .error-message { font-size: 1.2em; }
            .error-description { font-size: 1em; }
            .error-actions { flex-direction: column; align-items: center; }
            .btn { width: 200px; }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="error-container">
        <div class="logo-container">
            <img src="../public/brand/logos/ss-logomark-light.svg" alt="SuamiSihat Logo">
        </div>
        
        <h1 class="error-num">403</h1>
        
        <!-- Padlock Widget -->
        <div class="lock-wrapper" title="Access Forbidden">
            <div class="lock-shackle"></div>
            <div class="lock-body">
                <div class="lock-keyhole"></div>
            </div>
        </div>
        
        <p class="error-message">
            Access Denied! You don't have authorization.
        </p>
        
        <p class="error-description">
            This resource is restricted. If you believe this is in error, please request permission from the brand team.
        </p>
        
        <div class="error-actions">
            <a href="../index.html" class="btn btn-primary">Go Home</a>
            <a href="mailto:branding@suamisihat.com?subject=SS%20Design%20System%20Access%20Request" class="btn">Request Access</a>
            <a href="mailto:branding@suamisihat.com" class="btn">Contact Support</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Parallax effect on mousemove
            document.addEventListener('mousemove', function(e) {
                const particles = document.querySelectorAll('.particle');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                particles.forEach((particle, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed;
                    const y = (mouseY - 0.5) * speed;
                    
                    particle.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        });
    </script>
</body>
</html>
